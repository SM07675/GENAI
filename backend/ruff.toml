# ruff — fast Python linter + auto-fixer
# Run: ruff check . --fix
# https://docs.astral.sh/ruff/

[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
# Rules: E/W (pycodestyle), F (pyflakes), I (isort), B (bugbear), UP (pyupgrade)
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI patterns)
    "B904",   # raise from — optional in some catch-all blocks
    "UP007",  # Use X | Y — requires Python 3.10+ which we support
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
